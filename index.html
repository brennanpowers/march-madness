<!DOCTYPE html>
<html lang="en" class="zoomed">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>March Madness Pool</title>
  <script>if (localStorage.getItem('zoom') === '0') document.documentElement.classList.remove('zoomed');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Passion+One:wght@700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="title-block">
      <h1 class="title-text">March Madness Pool</h1>
      <span id="title-year" class="title-year"></span>
    </div>
    <nav id="main-nav">
      <select id="year-select" title="Select year"></select>
      <button class="tab active" data-tab="bracket">Bracket</button>
      <button class="tab" data-tab="roster">Roster</button>
      <button id="zoom-toggle" class="tab" title="Toggle text size" onclick="(function(){var z=document.documentElement.classList.toggle('zoomed');localStorage.setItem('zoom',z?'1':'0');})()">Aa</button>
    </nav>
  </header>

  <div id="leaderboard"></div>

  <main>
    <section id="bracket-view">
      <div id="region-tabs"></div>
      <div id="bracket-container"></div>
    </section>

    <section id="roster-view" class="hidden"></section>
  </main>

  <div id="score-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button class="modal-close">&times;</button>
      <div id="score-breakdown"></div>
    </div>
  </div>

  <a href="https://github.com/brennanpowers/march-madness" class="github-link" target="_blank" rel="noopener" title="View on GitHub">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>

  <script src="js/espn.js"></script>
  <script src="js/app.js"></script>
  <script src="js/bracket.js"></script>
  <script src="js/roster.js"></script>
</body>
</html>
